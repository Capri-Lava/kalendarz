<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan zajęć</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan zajęć"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f1">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2"><link rel="icon" href="apple-touch-icon.png?v=2">
<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1d1d1b;--mu:#76746d;--ln:#e4e2db;--sl:#ecebe5;--ac:#707075;--na:#00bfff;--mi:#d6341f;--nat:#08222e;--mit:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16161a;--cd:#202026;--tx:#f0efea;--mu:#9a98a0;--ln:#33333b;--sl:#1d1d22;--ac:#8e8e93;--na:#0a7ea8;--mi:#a32616;--nat:#fff}}
:root[data-theme="dark"]{--bg:#16161a;--cd:#202026;--tx:#f0efea;--mu:#9a98a0;--ln:#33333b;--sl:#1d1d22;--ac:#8e8e93;--na:#0a7ea8;--mi:#a32616;--nat:#fff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.3 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:10px 10px 40px}
.Na{background:var(--na);color:var(--nat)}.Mi{background:var(--mi);color:var(--mit)}

/* górny pasek */
.top{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.kids{display:flex;gap:6px}
.kids button{border:0;background:none;padding:3px;border-radius:50%;box-shadow:0 0 0 2.5px transparent;transition:box-shadow .15s}
.kids button.on{box-shadow:0 0 0 2.5px var(--ac)}
.dot{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff!important;font:700 15px/1 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;text-shadow:0 1px 2px #0004}
.dot.Razem{background:linear-gradient(90deg,var(--na) 50%,var(--mi) 50%);font-size:11.5px;letter-spacing:-.2px}
.seg{flex:1;display:flex;background:var(--ln);border-radius:11px;padding:3px;min-width:0}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:9px 2px;border-radius:8px;font:inherit;font-size:14px;font-weight:600;min-width:0}
.seg button.on{background:var(--cd);box-shadow:0 1px 3px #0003}

/* wybór dnia */
.days{display:flex;gap:4px;margin:0 0 10px}
.days button{flex:1;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:11px;padding:7px 0;font:inherit;font-size:14px;font-weight:600;position:relative}
.days button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.days button.td:after{content:"";position:absolute;left:50%;bottom:2px;width:5px;height:5px;margin-left:-2px;border-radius:9px;background:currentColor;opacity:.6}
h2{font-size:17px;margin:0 2px 8px}

/* oś czasu – wspólne */
.hd{display:grid;gap:4px;margin-bottom:4px}
.hd>div{text-align:center;font-weight:700;font-size:13px;padding:4px 0;border-radius:8px}
.hd .wh{background:var(--cd);border:1px solid var(--ln);cursor:pointer}.hd .wh.td{background:var(--ac);color:#fff;border-color:var(--ac)}
.tl{display:grid;gap:4px;position:relative}
.col,.ax{position:relative}
.band{position:absolute;left:0;right:0;border-radius:8px;background:var(--sl)}
.gp{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ln)}
.al{position:absolute;right:3px;font-size:11px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.al.s{font-weight:700}.al.e{color:var(--mu);font-size:10px}.al.h{color:var(--mu)}
.nowl{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--ac);z-index:0}
.nowl:before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--ac)}
.ev{position:absolute;border-radius:9px;overflow:hidden;border:2px solid transparent;z-index:1}
.ev.now{border-color:var(--ac);box-shadow:0 0 0 1px var(--bg)}

/* dzień */
.dv .ev{padding:3px 8px;display:flex;flex-direction:column;justify-content:center}
.dv .ev b{font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv .ev small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv .ev.sm{flex-direction:row;align-items:center;gap:6px}.dv .ev.sm b{font-size:13px}
.dv .ev i{position:absolute;top:3px;right:4px;font-style:normal;font-size:10px;font-weight:700;border-radius:6px;padding:1px 5px;background:var(--ac);color:#fff}
.dv .al{font-size:12px}.dv .al.e{font-size:11px}

/* tydzień */
.wv .day{display:flex;gap:2px}.wv .day>.col{flex:1;min-width:0}
.wv .ev{border-radius:6px;padding:2px 2px;text-align:center;line-height:1.1;font-size:11px;display:flex;flex-direction:column;justify-content:center;border-width:1.5px}
.wv .ev b{font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:clip}
.wv .ev small{font-size:9.5px;opacity:.75}
.wv .ev.x{display:block;text-align:left;padding:2px 3px;font-size:9.5px;line-height:1.12;overflow-wrap:normal;word-break:normal}
.wv .ev.x b{white-space:normal;font-weight:700;display:block}
.wv.two .ev{font-size:10px}.wv.two .ev small{font-size:9px}.wv.two .ev.x{font-size:8.5px;padding:2px 2px}
.we{font-size:13px;color:var(--mu);margin:10px 2px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
</style></head><body>
<div id="app"></div>
<script>
const D=["Poniedziałek","Wtorek","Środa","Czwartek","Piątek","Sobota","Niedziela"],S=["Pn","Wt","Śr","Cz","Pt","So","Nd"];
const T=[["08:00","08:45"],["08:55","09:40"],["09:50","10:35"],["10:45","11:30"],["11:45","12:30"],["12:50","13:35"],["13:50","14:35"],["14:45","15:30"],["15:35","16:20"]];
const E=[];
const L=(k,d,a)=>a.forEach(([i,t,r])=>E.push({k,d,i,s:T[i-1][0],e:T[i-1][1],t,r}));
const X=(k,d,s,e,t,r)=>E.push({k,d,s,e,t,r:r||"",x:1});
L('Na',0,[[3,'j.pol.','20'],[4,'matma','22'],[5,'technika','25'],[6,'j.ang.','30'],[7,'w-f','H1']]);
L('Mi',0,[[1,'Dz1','27'],[2,'chemia','18?'],[3,'j.pol.',''],[4,'w-f',''],[5,'historia','27'],[6,'matma','21'],[7,'fizyka','18']]);
X('Na',0,'16:00','18:00','Edukreska');X('Mi',0,'16:30','18:00','Polak','100 zł*');
L('Na',1,[[2,'j.ang.','30'],[3,'muzyka','25'],[4,'j.pol.','20'],[5,'w-f','H1']]);
X('Na',1,'08:00','08:45','FIZJO','7h');X('Na',1,'13:45','15:15','ANG. Stankiewicz');X('Na',1,'17:15','18:30','Valldal');
L('Mi',1,[[1,'j.ang. GR II','29'],[2,'WOS','27'],[3,'matma','21'],[4,'j.pol.',''],[5,'informatyka','9'],[6,'historia','27'],[7,'w-f','']]);
X('Mi',1,'18:30','20:00','GAS SP21');
L('Na',2,[[1,'j.pol.','20'],[2,'historia','27'],[3,'j.ang.','30'],[4,'informatyka','9'],[5,'matma','22']]);
L('Mi',2,[[1,'fizyka',''],[2,'matma','21'],[3,'Zzw','29'],[4,'w-f','H1'],[5,'j.pol.','20'],[6,'j.hiszpański','19'],[7,'j.hiszpański','19']]);
X('Mi',2,'14:45','16:20','Koło chemiczne','SP18');
L('Na',3,[[1,'j.pol.','20'],[2,'ezdr.','23'],[3,'matma','22'],[4,'plastyka','25'],[5,'w-f','H1'],[6,'Zzw','20']]);
X('Na',3,'14:30','16:00','ANG. Stankiewicz');
L('Mi',3,[[2,'j.pol.','20'],[3,'biologia','23'],[4,'WOS','27'],[5,'Edb','25'],[6,'j.ang. GR II','29'],[7,'matma','21'],[8,'Ezdr','18']]);
X('Mi',3,'18:30','20:00','GAS SP21');
L('Na',4,[[2,'w-f','H2'],[3,'j.pol.','20'],[4,'biologia','23'],[5,'geografia','27'],[6,'historia','18'],[7,'matma','22']]);
L('Mi',4,[[1,'w-f','SG'],[2,'matma','21'],[3,'geografia','19'],[4,'chemia','18'],[5,'j.pol.','20'],[6,'j.ang. GR II','29']]);
X('Mi',4,'15:30','16:30','ANG. Magda Więcław','120 zł');
X('Na',6,'17:30','18:15','Basen');X('Mi',6,'17:30','18:15','Basen');

const SH={'matma':'mat.','historia':'hist.','informatyka':'inf.','chemia':'chem','biologia':'biol.','geografia':'geo.','technika':'tech.','muzyka':'muz.','plastyka':'plast.','fizyka':'fiz.','j.hiszpański':'hisz.','j.ang. GR II':'ang.','j.ang.':'ang.','j.pol.':'pol.'};
// krótkie nazwy zajęć dodatkowych w widoku tygodnia „Razem”
const SL={'j.hiszpański':'j.hiszp.','informatyka':'informat.','j.ang. GR II':'j.ang. II'};
const SX={'Edukreska':'Edu­kreska','ANG. Stankiewicz':'ANG Stank.','Valldal':'Vall­dal','Koło chemiczne':'Koło chem.','ANG. Magda Więcław':'ANG Magda','GAS SP21':'GAS SP21'};
const now=new Date(),td=(now.getDay()+6)%7,nm=now.getHours()*60+now.getMinutes();
let K='Razem',V='day',day=td;
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=t=>+t.slice(0,2)*60+ +t.slice(3);
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const sh=t=>t.replace(/^0/,'');
const kids=()=>K==='Razem'?['Na','Mi']:[K];
const G=18; // wysokość „przerwy” w osi, gdy długo nic się nie dzieje

/* Oś czasu: sloty lekcyjne mają stałą wysokość, reszta proporcjonalnie.
   Długie puste odcinki poza lekcjami są skracane do kreski. */
function mkMap(evs,ppm,school){
 const iv=evs.map(e=>[mins(e.s),mins(e.e)]);
 const li=Math.max(0,...evs.filter(e=>e.i).map(e=>e.i));
 const lr=school&&li?[mins(T[0][0]),mins(T[li-1][1])]:null;
 if(lr)iv.push(lr);
 iv.sort((a,b)=>a[0]-b[0]);const k=[];
 for(const [a,b] of iv){const l=k[k.length-1];if(l&&a<=l[1]+25)l[1]=Math.max(l[1],b);else k.push([a,b])}
 const seg=[];let y=0;
 k.forEach((r,i)=>{if(i){seg.push({gap:y});y+=G}seg.push({a:r[0],b:r[1],y0:y});y+=(r[1]-r[0])*ppm});
 const Y=t=>{for(const s of seg)if(s.a!==undefined&&t>=s.a&&t<=s.b)return s.y0+(t-s.a)*ppm;return null};
 return {Y,total:Math.ceil(y),seg,lr,li};
}
function lanes(l){
 l.sort((a,b)=>a.s.localeCompare(b.s));let grp=[],end=-1;
 const flush=()=>{const Ls=[];grp.forEach(e=>{let i=Ls.findIndex(x=>x<=mins(e.s));if(i<0){i=Ls.length;Ls.push(0)}Ls[i]=mins(e.e);e._l=i});grp.forEach(e=>e._n=Ls.length);grp=[]};
 l.forEach(e=>{if(mins(e.s)>=end){flush();end=mins(e.e)}else end=Math.max(end,mins(e.e));grp.push(e)});flush();return l;
}
function axis(m,big){
 let h='';const used=[];
 const lab=(y,txt,c)=>{if(y==null)return;h+=`<div class="al ${c}" style="top:${y}px">${txt}</div>`;used.push(y)};
 const free=y=>used.every(u=>Math.abs(u-y)>13);
 if(m.lr)for(let i=0;i<m.li;i++){const a=m.Y(mins(T[i][0])),b=m.Y(mins(T[i][1]));lab(a+2,sh(T[i][0]),'s');lab(b-(big?13:11),sh(T[i][1]),'e')}
 m.seg.forEach(s=>{if(s.a===undefined)return;
  if(!m.lr||s.a>m.lr[1]||s.b<m.lr[0]){const y=m.Y(s.a);if(free(y))lab(y+1,sh(hm(s.a)),'h')}
  for(let t=Math.ceil(s.a/60)*60;t<=s.b;t+=60){if(m.lr&&t>=m.lr[0]&&t<=m.lr[1])continue;const y=m.Y(t);if(free(y)&&y<m.total-8)lab(y-5,sh(hm(t)),'h')}});
 return h;
}
const bands=m=>{let h='';if(m.lr)for(let i=0;i<m.li;i++){const a=m.Y(mins(T[i][0])),b=m.Y(mins(T[i][1]));h+=`<div class="band" style="top:${a}px;height:${b-a}px"></div>`}
 m.seg.forEach(s=>{if(s.gap!==undefined)h+=`<div class="gp" style="top:${s.gap+G/2}px"></div>`});return h};
const nowLine=(m,d)=>{if(d!==td)return'';const y=m.Y(nm);return y==null?'':`<div class="nowl" style="top:${y}px"></div>`};
const isNow=e=>e.d===td&&mins(e.s)<=nm&&nm<mins(e.e);
const pos=(m,e)=>{const a=m.Y(mins(e.s)),b=m.Y(mins(e.e));return {a,h:b-a,st:`top:${a+1}px;height:${b-a-2}px;left:calc(${e._l/e._n*100}% + ${e._l?1:0}px);width:calc(${100/e._n}% - ${e._n>1?1:0}px)`}};

function topBar(){
 return `<div class="top"><div class="kids">${['Na','Mi','Razem'].map(x=>`<button class="${x===K?'on':''}" data-a="kid" data-v="${x}" aria-label="${x}"><span class="dot ${x==='Razem'?'Razem':x}">${x}</span></button>`).join('')}</div>`+
 `<div class="seg">${[['day','Dzień'],['week','Tydzień']].map(([v,l])=>`<button class="${V===v?'on':''}" data-a="view" data-v="${v}">${l}</button>`).join('')}</div></div>`;
}

function dayView(){
 let h=`<div class="days">${S.map((s,d)=>`<button class="${d===day?'on':''} ${d===td?'td':''}" data-a="day" data-d="${d}">${s}</button>`).join('')}</div><h2>${D[day]}${day===td?' · dziś':''}</h2>`;
 const ks=kids(),l=E.filter(e=>e.d===day&&ks.includes(e.k));
 if(!l.length)return h+'<div class="empty">Brak zajęć 🎉</div>';
 const m=mkMap(l,58/45,day<5),cols=`46px repeat(${ks.length},1fr)`;
 if(ks.length>1)h+=`<div class="hd" style="grid-template-columns:${cols}"><div></div>${ks.map(k=>`<div class="${k}">${k}</div>`).join('')}</div>`;
 h+=`<div class="tl dv" style="grid-template-columns:${cols};height:${m.total}px"><div class="ax">${axis(m,1)}</div>`;
 ks.forEach(k=>{
  h+=`<div class="col">${bands(m)}`;
  lanes(l.filter(e=>e.k===k)).forEach(e=>{const p=pos(m,e),nw=isNow(e);
   const sub=e.x?`${e.s}–${e.e}${e.r?' · '+esc(e.r):''}`:(e.r?'s. '+esc(e.r):'');
   h+=`<div class="ev ${k} ${nw?'now':''} ${p.h<42?'sm':''}" style="${p.st}"><b>${esc(e.t)}</b>${sub?`<small>${sub}</small>`:''}${nw?'<i>teraz</i>':''}</div>`});
  h+=nowLine(m,day)+'</div>'});
 return h+'</div>';
}

function weekView(){
 const ks=kids(),two=ks.length>1,l=E.filter(e=>e.d<5&&ks.includes(e.k));
 const m=mkMap(l,40/45,1),cols='34px repeat(5,1fr)';
 let h=`<div class="hd" style="grid-template-columns:${cols}"><div></div>${[0,1,2,3,4].map(d=>`<div class="wh ${d===td?'td':''}" data-a="gd" data-d="${d}">${S[d]}</div>`).join('')}</div>`;
 h+=`<div class="tl wv ${two?'two':''}" style="grid-template-columns:${cols};height:${m.total}px;gap:4px 3px"><div class="ax">${axis(m,0)}</div>`;
 for(let d=0;d<5;d++){
  h+=`<div class="day">`;
  ks.forEach(k=>{
   h+=`<div class="col">${bands(m)}`;
   lanes(l.filter(e=>e.d===d&&e.k===k)).forEach(e=>{const p=pos(m,e),nw=isNow(e);
    h+=e.x?`<div class="ev x ${k} ${nw?'now':''}" style="${p.st}"><b>${sh(e.s)}</b>${two?(SX[e.t]||esc(e.t)):esc(e.t)}</div>`
          :`<div class="ev ${k} ${nw?'now':''}" style="${p.st}"><b>${esc(two?(SH[e.t]||e.t):(SL[e.t]||e.t))}</b>${e.r?`<small>${esc(e.r)}</small>`:''}</div>`});
   h+=nowLine(m,d)+'</div>'});
  h+='</div>';
 }
 h+='</div>';
 const w=E.filter(x=>x.d>=5&&ks.includes(x.k)).sort((a,b)=>a.d-b.d||a.s.localeCompare(b.s));
 if(w.length)h+=`<div class="we">Weekend: ${w.map(x=>`${S[x.d]} ${x.s} ${esc(x.t)}${two?` (${x.k})`:''}`).join(' · ')}</div>`;
 return h;
}

function render(){app.innerHTML=topBar()+(V==='day'?dayView():weekView())}
app.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='kid')K=b.dataset.v;else if(a==='view')V=b.dataset.v;
 else if(a==='day')day=+b.dataset.d;else if(a==='gd'){day=+b.dataset.d;V='day'}
 render();
});
let x0=null;
app.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
app.addEventListener('touchend',e=>{if(x0===null||V!=='day')return;const dx=e.changedTouches[0].clientX-x0;x0=null;
 if(Math.abs(dx)>70){day=(day+(dx<0?1:6))%7;render()}},{passive:true});
render();
</script></body></html>
